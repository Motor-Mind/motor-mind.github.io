<main class="wrap">
<div class="intro"><p id="subtitle" hidden></p><div class="stats" id="stats" hidden></div></div>
<section class="panel" aria-label="Decision Diagnostic examples">

<div class="answerbar"><div><label id="answer-label"></label><div class="answer" id="answer" aria-live="polite"></div></div><button class="primary" id="reveal"></button></div>

</div>
</section>
<nav class="pager" aria-label="Sample navigation"><button id="prev"></button><button id="random"></button><button id="next"></button></nav>
<div class="footer" id="keyboard-hint"></div>
<span id="source-note" hidden></span>
</main>

 are from the camera mounted on the gripper, which moves with it. Camera motion alone is not object motion. Compare the two views and, when supplied, the two times.\nSUBGOAL REFERENCE FRAME: Unless explicitly stated otherwise, left/right and leftmost/rightmost in the natural-language subgoal or success criterion refer to LEFT and RIGHT IN THE FIXED EXTERNAL CAMERA IMAGE (the view labeled \"scene\"), as seen by the viewer looking at the displayed image. Image-left means the left side of that image; image-right means the right side of that image. For example, \"the bowl to the right of the plate\" identifies the bowl on the plate's image-right side in the scene view. These words do not specify a robot-base action direction. Do not use the moving wrist camera to redefine these relations. Object-relative descriptions such as \"in front of the stove\" retain their contextual spatial meaning; do not automatically reinterpret them as base +X or -X.\nACTION OUTPUT REFERENCE FRAME: Only the direction names in the output action use the robot BASE coordinate system. Translation: forward=+X, backward=-X, left=+Y, right=-Y, up=+Z, down=-Z. Rotations use the right-hand rule about base axes: yaw_left=+Z, yaw_right=-Z, pitch_up=-Y, pitch_down=+Y, roll_ccw=+X, roll_cw=-X. Base and world axes align in these scenes. A target on image-right does not necessarily require the action \"right\"; identify the intended target in the scene view, then choose the base-frame motion toward it. The reference frames are distinct; no universal image-left/base-left or image-right/base-right equivalence is specified.\nFor action selection, choose the primary NEXT primitive after current t1 that advances the subgoal; do not describe the past motion. Valid outputs: {\"type\":\"move\",\"direction\":\"forward|backward|left|right|up|down\"}, {\"type\":\"rotate\",\"direction\":\"yaw_left|yaw_right|pitch_up|pitch_down|roll_ccw|roll_cw\"}, or {\"type\":\"gripper\",\"state\":\"open|close\"}. Choose a single value, not the literal pipe-separated list. No distance or angle is requested.\n", "progress": "You are evaluating robot observations for an embodied decision task. Use only the supplied images, subgoal and success criterion. Return exactly one JSON object with no explanation.\nImages are upright RGB. The images labeled \"scene\" are from the fixed EXTERNAL camera; the images labeled \"wrist\" are from the camera mounted on the gripper, which moves with it. Camera motion alone is not object motion. Compare the two views and, when supplied, the two times.\nSUBGOAL REFERENCE FRAME: Unless explicitly stated otherwise, left/right and leftmost/rightmost in the natural-language subgoal or success criterion refer to LEFT and RIGHT IN THE FIXED EXTERNAL CAMERA IMAGE (the view labeled \"scene\"), as seen by the viewer looking at the displayed image. Image-left means the left side of that image; image-right means the right side of that image. For example, \"the bowl to the right of the plate\" identifies the bowl on the plate's image-right side in the scene view. These words do not specify a robot-base action direction. Do not use the moving wrist camera to redefine these relations. Object-relative descriptions such as \"in front of the stove\" retain their contextual spatial meaning; do not automatically reinterpret them as base +X or -X.\nFor progress verification, output {\"label\":1} if the change from t0 to t1 advances the stated subgoal, otherwise {\"label\":0}. A subgoal need not be complete to show progress; preparation counts when it advances the stated subgoal. Mere unrelated motion does not.\n", "completion": "You are evaluating robot observations for an embodied decision task. Use only the supplied images, subgoal and success criterion. Return exactly one JSON object with no explanation.\nImages are upright RGB. The images labeled \"scene\" are from the fixed EXTERNAL camera; the images labeled \"wrist\" are from the camera mounted on the gripper, which moves with it. Camera motion alone is not object motion. Compare the two views and, when supplied, the two times.\nSUBGOAL REFERENCE FRAME: Unless explicitly stated otherwise, left/right and leftmost/rightmost in the natural-language subgoal or success criterion refer to LEFT and RIGHT IN THE FIXED EXTERNAL CAMERA IMAGE (the view labeled \"scene\"), as seen by the viewer looking at the displayed image. Image-left means the left side of that image; image-right means the right side of that image. For example, \"the bowl to the right of the plate\" identifies the bowl on the plate's image-right side in the scene view. These words do not specify a robot-base action direction. Do not use the moving wrist camera to redefine these relations. Object-relative descriptions such as \"in front of the stove\" retain their contextual spatial meaning; do not automatically reinterpret them as base +X or -X.\nFor goal completion, output {\"label\":1} only if the stated subgoal and its success criterion are satisfied at t1, otherwise {\"label\":0}. If release is required, holding an object at the target is insufficient."}}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('dataset').textContent),$=id=>document.getElementById(id);
const titles={action:'Action selection',progress:'Progress verification',completion:'Goal completion'};
const zhTitles={action:'动作选择',progress:'进展判断',completion:'完成判断'};
let zh=false,filtered=[],position=0,revealed=false,useHD=true;
const tr=(en,cn)=>zh?cn:en;
const title=t=>zh?zhTitles[t]:titles[t];
const current=()=>filtered[position];
function option(value,text){return new Option(text,value)}
function language(){
 document.documentElement.lang='en';
 $('subtitle').textContent=tr('Observe the scene. Understand the goal. Make the next decision.','观察场景，理解目标，做出下一步决策。');
 $('stats').replaceChildren(...['action','progress','completion'].map(t=>{const s=document.createElement('span'),b=document.createElement('b');b.textContent=DATA.items.filter(x=>x.task_type===t).length;s.append(b,' '+title(t));return s}));
 const selected=$('type').value||'action';$('type').replaceChildren(...Object.keys(titles).map(t=>option(t,title(t))));$('type').value=selected;
 for(const [id,en,cn] of [['type-label','Task type','任务类型'],['sample-label','Task name','任务名称'],['subgoal-label','Subgoal','子目标'],['criterion-label','Success criterion:','成功条件：'],['observation-label','Visual observations','视觉观察'],['image-hint','Click an image to enlarge','点击图片放大'],['answer-label','Reference answer','参考答案'],['prev','← Previous','← 上一题'],['random','Random sample','随机题目'],['next','Next →','下一题 →'],['keyboard-hint','Use ← / → to browse · Answers are hidden until revealed','使用 ← / → 切换题目 · 点击按钮后显示答案'],['source-note','240 items from the approved set','已审核题库 · 240 题']])$(id).textContent=tr(en,cn);
 $('empty').textContent=tr('No samples for this task.','该任务暂无样本。');
 filter(current()?.item_id);
}
function filter(keep){
 const target=DATA.items.find(x=>x.item_id===keep);
 if(target)$('type').value=target.task_type;
 const candidates=DATA.items.filter(x=>x.task_type===$('type').value);
 const goals=[...new Map(candidates.map(x=>[x.subgoal,x])).values()];
 const selected=target?.subgoal||$('sample').value;
 $('sample').replaceChildren(...goals.map(x=>option(x.subgoal,(zh&&x.subgoal_zh)||x.subgoal)));
 if(goals.some(x=>x.subgoal===selected))$('sample').value=selected;
 filtered=candidates;
 position=Math.max(0,filtered.findIndex(x=>keep?x.item_id===keep:x.subgoal===$('sample').value));
 render();
}
function render(){
 const x=current(),none=!x;$('empty').hidden=!none;$('content').hidden=none;$('sample').disabled=none;
 $('prev').disabled=none||position===0;$('next').disabled=none||position===filtered.length-1;$('random').disabled=filtered.length<2;
 revealed=false;if(none){$('images').replaceChildren();$('answer').textContent='';return}
 $('sample').value=x.subgoal;$('badge').textContent=title(x.task_type);$('counter').textContent=`${position+1} / ${filtered.length}`;
 $('subgoal').textContent=(zh&&x.subgoal_zh)||x.subgoal;$('criterion').textContent=(zh&&x.success_test_zh)||x.success_test;
 const qs={action:tr('What is the primary next action after t1 that advances the subgoal?','在 t1 之后，推进子目标的首要下一步动作是什么？'),progress:tr('Does the change from t0 to t1 advance the stated subgoal?','从 t0 到 t1 的变化是否推进了给定子目标？'),completion:tr('Are the subgoal and its success criterion satisfied at t1?','t1 时是否已满足子目标及其成功条件？')};$('question').textContent=qs[x.task_type];
 renderPrompt(x);
 $('images').classList.toggle('two',x.images.length===2);
 const hasHD=x.hd_images?.some(Boolean);
 $('image-hint').textContent=useHD&&hasHD?tr('HD preview · Click to enlarge.','高清预览 · 点击放大，可切换查看原始题图。'):tr('Original benchmark images · Click to enlarge.','原始题图 · 点击放大。');
 $('images').replaceChildren(...x.images.map((path,i)=>{
  const hd=useHD&&x.hd_images?.[i];if(hd)path=hd;
  const legend=x.image_legends[i],fig=document.createElement('figure'),cap=document.createElement('figcaption'),time=document.createElement('span'),btn=document.createElement('button'),img=document.createElement('img');
  fig.className='frame';const wrist=legend.includes('wrist');cap.append(wrist?tr('Wrist camera','腕部视角'):tr('Scene camera','场景视角'));time.textContent=legend.match(/t\d+/)?.[0]||'';cap.append(time);
  btn.className='image-button';btn.setAttribute('aria-label',tr('Enlarge ','放大 ')+legend);img.src='./'+path.split('/').map(encodeURIComponent).join('/');img.alt=`${x.item_id} · ${legend}`;
  img.onerror=()=>{btn.textContent=tr('Image unavailable','图片无法加载');btn.classList.add('error');btn.disabled=true};btn.append(img);
  btn.onclick=()=>{$('zoom-title').textContent=img.alt;$('zoom-image').src=img.src;$('zoom-image').alt=img.alt;$('zoom').showModal()};fig.append(cap,btn);return fig;
 }));
 answer();history.replaceState(null,'','#'+encodeURIComponent(x.item_id));
}
function renderPrompt(x){
 $('prompt-heading').textContent=tr('Decision Task','决策任务');
 $('output-label').textContent=tr('Output format','输出格式');
 $('prompt-observation').textContent=tr('Use only the supplied images, subgoal and success criterion. The scene camera is fixed; the wrist camera moves with the gripper. Camera motion alone is not object motion.','仅依据给定图片、子目标和成功条件作答。Scene 是固定场景相机，Wrist 是随夹爪移动的腕部相机；相机运动本身不等于物体运动。');
 const rules={
  action:tr('Compare the views at t0 and t1, then choose one primary next primitive after t1 that advances the subgoal. Do not describe the past motion. No distance or angle is requested.','比较 t0 和 t1 的两个视角，选择在 t1 之后推进子目标的一个首要基础动作。不要描述已经发生的运动，无需输出距离或角度。'),
  progress:tr('Compare t0 with t1. Return 1 if the change advances the stated subgoal, otherwise return 0. The subgoal need not be complete: preparation counts when it advances the goal, but unrelated motion does not.','比较 t0 与 t1：如果变化推进了给定子目标，返回 1，否则返回 0。子目标无需已经完成；有助于目标的准备动作也算进展，无关运动不算。'),
  completion:tr('Evaluate the state at t1. Return 1 only when both the subgoal and its success criterion are satisfied; otherwise return 0. If release is required, holding the object at the target is insufficient.','判断 t1 的状态：仅当子目标及成功条件均已满足时返回 1，否则返回 0。如果要求释放物体，仅夹持着物体到达目标位置并不算完成。')
 };
 $('prompt-rule').textContent=rules[x.task_type];
 $('prompt-coordinates').textContent=tr('Unless stated otherwise, left/right in the subgoal refer to the fixed scene image. Object-relative relations retain their contextual meaning.','除非另有说明，子目标中的左右关系以固定场景图像为准；物体相对关系保留其上下文含义。')+(x.task_type==='action'?tr(' Action directions use robot base axes: forward/backward = ±X, left/right = ±Y, up/down = ±Z. Image directions and base directions are not interchangeable.',' 动作方向使用机器人基座坐标系：前/后 = ±X，左/右 = ±Y，上/下 = ±Z。图像方向与基座方向不能直接等同。'):'');
 $('output-format').textContent=x.task_type==='action'?'{"type":"move","direction":"forward|backward|left|right|up|down"}\n{"type":"rotate","direction":"yaw_left|yaw_right|pitch_up|pitch_down|roll_ccw|roll_cw"}\n{"type":"gripper","state":"open|close"}':'{"label": 1}  '+tr('or','或')+'  {"label": 0}';
 $('output-note').textContent=tr('Return exactly one JSON object with no explanation.','仅返回一个 JSON 对象，不附加解释。')+(x.task_type==='action'?tr(' Choose one of the three formats and one value from its options; do not return the pipe-separated list. Rotations follow the right-hand rule: yaw_left/right = +Z/−Z, pitch_up/down = −Y/+Y, roll_ccw/cw = +X/−X.',' 从上述三种格式中选择一种，并从候选值中选择一个值，不要输出竖线分隔的列表。旋转遵循右手定则：yaw_left/right = +Z/−Z，pitch_up/down = −Y/+Y，roll_ccw/cw = +X/−X。'):'');
}
function answer(){
 $('reveal').textContent=revealed?tr('Hide answer','隐藏答案'):tr('Reveal answer','显示答案');$('reveal').setAttribute('aria-expanded',String(revealed));
 const x=current();if(!x)return;
 if(!revealed){$('answer').textContent=tr('Make your decision, then reveal.','先做出判断，再查看参考答案。');return}
 if(typeof x.answer==='object')$('answer').textContent=JSON.stringify(x.answer);
 else $('answer').textContent=JSON.stringify({label:x.answer})+' · '+(x.task_type==='progress'?(x.answer===1?tr('Progress','有进展'):tr('No progress','无进展')):(x.answer===1?tr('Complete','已完成'):tr('Incomplete','未完成')));
}
$('type').onchange=()=>filter();$('sample').onchange=()=>filter();
$('reveal').onclick=()=>{revealed=!revealed;answer()};
$('prev').onclick=()=>{if(position>0){position--;render()}};$('next').onclick=()=>{if(position<filtered.length-1){position++;render()}};
$('random').onclick=()=>{if(filtered.length>1){position=(position+1+Math.floor(Math.random()*(filtered.length-1)))%filtered.length;render()}};
$('close-zoom').onclick=()=>$('zoom').close();$('zoom').onclick=e=>{if(e.target===$('zoom'))$('zoom').close()};
document.addEventListener('keydown',e=>{if($('zoom').open||['INPUT','SELECT','TEXTAREA','BUTTON','SUMMARY'].includes(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='ArrowLeft'){e.preventDefault();$('prev').click()}if(e.key==='ArrowRight'){e.preventDefault();$('next').click()}});
function readHash(){try{return decodeURIComponent(location.hash.slice(1))}catch{return ''}}
window.addEventListener('hashchange',()=>{const id=readHash();if(DATA.items.some(x=>x.item_id===id)){filter(id)}});
const initial=readHash();language();if(initial)filter(initial);
</script>
</body>
</html>
